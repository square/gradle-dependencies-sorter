plugins {
  id 'com.squareup.lib'
  alias(libs.plugins.dokka)
  alias(libs.plugins.mavenPublish)
}

kotlin {
  explicitApi()
}

dependencies {
  api(libs.grammar) {
    // The grammar is generated Java; its build's Kotlin dependencies are not needed here.
    exclude group: 'org.jetbrains.kotlin'
  }
  api libs.kotlinEditor.core

  testImplementation libs.spock
}
