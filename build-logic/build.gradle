import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
  alias(libs.plugins.kotlin.jvm)
  id 'java-gradle-plugin'
}

gradlePlugin {
  plugins {
    lib {
      id = 'com.squareup.lib'
      implementationClass = 'com.squareup.convention.LibConvention'
    }
    app {
      id = 'com.squareup.app'
      implementationClass = 'com.squareup.convention.AppConvention'
    }
    plugin {
      id = 'com.squareup.plugin'
      implementationClass = 'com.squareup.convention.PluginConvention'
    }
  }
}

tasks.withType(JavaCompile).configureEach {
  // This is build-time tooling, not the published CLI artifact (that stays on
  // the "java" version from libs.versions.toml via BaseConvention's toolchain).
  // Bumped to 17 because the shadow-gradle-plugin dependency below only
  // publishes a Java 17+ compatible variant from 9.x onward.
  options.release = 17
}

kotlin {
  compilerOptions {
    jvmTarget = JvmTarget.JVM_17
  }
}

dependencies {
  implementation libs.kotlin.gradle.plugin
  implementation libs.shadow.gradle.plugin
  implementation libs.maven.publish.plugin

  implementation(libs.okhttp3) {
    because('Closing and releasing Sonatype Nexus staging repo')
  }
  implementation(libs.retrofit.core) {
    because('Closing and releasing Sonatype Nexus staging repo')
  }
  implementation(libs.retrofit.converter.moshi) {
    because('Closing and releasing Sonatype Nexus staging repo')
  }

  implementation(libs.moshi.core) {
    because('Closing and releasing Sonatype Nexus staging repo')
  }
  implementation(libs.moshi.kotlin) {
    because('Closing and releasing Sonatype Nexus staging repo')
  }
}
